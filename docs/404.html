<style>
:root{
  --sky:#7CC6FF; --red:#FF5A5F; --sun:#FFD43B; --grass:#5BD17A; --ink:#13243B; --paper:#FFFFFF; --muted:#3B4C63;
  --display:"Lilita One","Arial Black","Impact",sans-serif;
  --body:"Rubik","Segoe UI",system-ui,-apple-system,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky:#1C3F66;--paper:#FFF9EF}}
:root[data-theme="dark"]{--sky:#1C3F66;--paper:#FFF9EF}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;overflow-x:hidden;
  background-image:radial-gradient(circle at 20px 20px, rgba(255,255,255,.22) 3px, transparent 4px);background-size:44px 44px}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
img{max-width:100%;height:auto}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
.card{background:var(--paper);border:4px solid var(--ink);border-radius:22px;box-shadow:8px 8px 0 var(--ink)}
.marquee{background:var(--ink);color:var(--sun);font-family:var(--display);font-size:20px;white-space:nowrap;overflow:hidden}
.marquee div{display:inline-block;padding:10px 0;animation:scroll 32s linear infinite}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

.topbar{display:flex;justify-content:flex-end;padding:16px 0 0}
.nerdlink{display:inline-block;font-family:var(--display);font-size:19px;background:var(--paper);border:4px solid var(--ink);
  border-radius:999px;padding:7px 20px;box-shadow:4px 4px 0 var(--ink);text-decoration:none;color:var(--ink)}
.nerdlink:hover{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}

.hero{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:center;padding:20px 0 48px}
.ticker{display:inline-block;font-family:var(--display);font-size:26px;background:var(--red);color:var(--paper);
  -webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;padding:6px 20px;border:4px solid var(--ink);
  border-radius:999px;box-shadow:5px 5px 0 var(--ink);transform:rotate(-4deg);margin-bottom:20px}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(62px,11vw,136px);line-height:.84;margin:0;color:var(--paper);
  -webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:9px 9px 0 var(--ink);transform:rotate(-3deg)}
.hero .mascot{transform:scale(1.24);transform-origin:center}
.hero img{display:block;animation:bob 3.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-12px) rotate(1deg)}}

h2{font-family:var(--display);font-weight:400;font-size:clamp(36px,6vw,62px);line-height:.95;margin:0 0 24px;color:var(--paper);
  -webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--ink)}
section{padding:40px 0}

.comic{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.comic img{display:block;width:100%;border-radius:18px}

.cast{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.who{padding:16px;text-align:center}
.who img{display:block;margin:0 auto 6px}
.who h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 8px}
.who p{margin:0;font-weight:600;font-size:15px;line-height:1.45}
.who:nth-child(1){transform:rotate(-1.5deg)}
.who:nth-child(2){transform:rotate(1deg);background:#FFE3E3}
.who:nth-child(3){transform:rotate(-1deg);background:#E7EDF3}
.who:nth-child(4){transform:rotate(1.5deg);background:#E3FFE9}

.pitch{padding:30px 26px;font-size:clamp(20px,2.6vw,27px);font-weight:800;line-height:1.35;text-align:center}
.pitch .sell{display:block;margin-top:14px;font-size:19px;font-weight:700;color:var(--muted)}
.pitch a{color:var(--ink)}

.packgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.sticker{padding:12px;text-align:center;background:var(--paper)}
.sticker img{display:block;width:100%}
.sticker a{display:block;margin-top:6px;font-family:var(--display);font-size:16px;color:var(--ink);text-decoration:none}
.sticker a:hover{text-decoration:underline}
.getall{display:inline-block;margin-top:24px;font-family:var(--display);font-size:26px;background:var(--sun);color:var(--ink);
  border:4px solid var(--ink);border-radius:999px;padding:12px 28px;box-shadow:6px 6px 0 var(--ink);text-decoration:none}
.getall:active{transform:translate(4px,4px);box-shadow:2px 2px 0 var(--ink)}
.packnote{margin:14px 0 0;font-weight:600;color:var(--muted);font-size:15px}

.social{display:inline-flex;gap:10px;flex-wrap:wrap;margin-right:12px}
.social a{font-family:var(--display);font-size:17px;background:var(--paper);border:4px solid var(--ink);
  border-radius:999px;padding:5px 16px;box-shadow:3px 3px 0 var(--ink);text-decoration:none;color:var(--ink)}
.social a:hover{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.ca{margin:18px 0 0;padding:16px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
.ca .lbl{font-family:var(--display);font-size:19px}
.ca code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;word-break:break-all;
  background:var(--sky);border:3px solid var(--ink);border-radius:10px;padding:7px 11px}
.ca button{font-family:var(--display);font-size:17px;background:var(--sun);border:4px solid var(--ink);
  border-radius:999px;padding:6px 18px;box-shadow:3px 3px 0 var(--ink);cursor:pointer;color:var(--ink)}
.ca button:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
footer{padding:24px 0 56px}
footer .card{padding:22px;font-size:15px}
footer p{margin:0 0 10px}
footer a{color:var(--ink)}

@media (max-width:900px){
  .hero{grid-template-columns:1fr;padding-top:10px}
  .hero .mascot{max-width:330px;margin:0 auto;transform:none}
  .comic,.cast,.packgrid{grid-template-columns:1fr 1fr}
}
@media (max-width:560px){
  .comic,.cast{grid-template-columns:1fr}
  .packgrid{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="marquee" aria-hidden="true"><div id="mq"></div></div>
<div class="wrap">
  <div class="topbar"><a class="nerdlink" href="./">back to the playground &rarr;</a></div>
  <header class="hero">
    <div>
      <div class="ticker">404</div>
      <h1>NOTHING<br>HERE.</h1>
      <div class="card pitch" style="text-align:left;margin-top:22px">
        No backsies on that link either.
        <span class="sell"><a href="./">the playground</a> &nbsp;&middot;&nbsp; <a href="nerd.html">the nerd corner</a></span>
      </div>
    </div>
    <div class="mascot"><img src="assets/logo.png" width="1000" height="1000" alt="Jarold, arms folded"></div>
  </header>
</div>
<script>
document.getElementById("mq").textContent =
  "$NOBACKSIES \u2726 NOTHING HERE \u2726 NO BACKSIES ON THAT LINK EITHER \u2726 ".repeat(8);
</script>
</body>
</html>
